name: Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.asset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            binary: spykertyminstaller.exe
            asset: spykertyminstaller.exe
          # linux
          - os: ubuntu-22.04
            binary: spykertyminstaller
            asset: spykertyminstaller-linux-x86_64
    steps:
      - uses: actions/checkout@v7

      - name: Check SALT secret
        shell: bash
        env:
          SALT: ${{ secrets.SALT }}
        run: |
          if [ -z "$SALT" ]; then
            echo "::error::Repository secret SALT is not set"
            exit 1
          fi

      - name: Check that the tag matches the project version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version v$version"
            exit 1
          fi

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Update Rust
        shell: bash
        run: |
          rustup update stable --no-self-update
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Build
        env:
          SALT: ${{ secrets.SALT }}
        run: npx tauri build -- --locked

      - name: Rename binary
        shell: bash
        run: |
          mkdir out
          cp "src-tauri/target/release/${{ matrix.binary }}" "out/${{ matrix.asset }}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: bins
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: bins/*
